  .url { margin: .4em 0 0; font-weight: 900; font-size: clamp(28px, 4vw, 64px); letter-spacing: .01em; }
  .how { margin: 1.2em 0 0; font-weight: 700; font-size: clamp(18px, 2vw, 32px); line-height: 1.4; color: #c9cdd6; max-width: 14em; }
  .how b { color: var(--ink); }
  @media (max-aspect-ratio: 5/4) { main { grid-template-columns: 1fr; text-align: center; justify-items: center; } .how { max-width: 20em; } }
